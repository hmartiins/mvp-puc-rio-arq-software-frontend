# Sobe o sistema inteiro: Front (Nginx) + API (Spring Boot) + PostgreSQL.
#
# A API mora em outro repositorio. Clone os dois lado a lado:
#   git clone https://github.com/SEU-USUARIO/cardapio-semanal-front
#   git clone https://github.com/SEU-USUARIO/cardapio-semanal-api
# e rode `docker compose up --build` a partir deste diretorio.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cardapio
      POSTGRES_USER: cardapio
      POSTGRES_PASSWORD: cardapio
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardapio -d cardapio"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ../cardapio-semanal-api
    environment:
      DB_URL: jdbc:postgresql://db:5432/cardapio
      DB_USER: cardapio
      DB_PASSWORD: cardapio
      THEMEALDB_BASE_URL: https://www.themealdb.com/api/json/v1/1
      CORS_ALLOWED_ORIGINS: http://localhost:8081,http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  front:
    build:
      context: .
      args:
        # Lida pelo navegador do usuario, entao aponta para o host — nao para "api".
        VITE_API_URL: http://localhost:8080
    ports:
      - "8081:80"
    depends_on:
      - api

volumes:
  postgres-data:
